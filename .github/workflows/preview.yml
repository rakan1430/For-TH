name: النشر

# تنشر المنصّة **الحقيقية** موصولةً بقاعدة بياناتها على صفحات GitHub.
#
# ⚠️ تحتاج تفعيلاً مرّةً واحدة من المالك (صلاحية لا تملكها المهمّة):
#    Settings ← Pages ← Source: GitHub Actions
#
# ⚠️ ووضع العرض (بيانات تجريبية بلا قاعدة) لم يُحذف — يُبنى بـ`VITE_DEMO=1`
#    محلّياً، وهو المنشور على صفحة Artifact للمراجعة البصرية وحدها.
on:
  push:
    branches: ["claude/new-project-repositories-exeq9g"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - name: البناء
        run: npm run build
        working-directory: app
        env:
          # ⚠️ رابط Supabase ومفتاحه المعلَن يأتيان من `app/.env.production`
          #    المُودَع في المستودع — مصدرٌ واحد يعمل على أي مستضيف بلا ضبطٍ
          #    يدويّ في لوحة كلٍّ منهما. وهنا الخاصّ بصفحات GitHub وحدها:
          # صفحات GitHub تخدم من مجلّدٍ باسم المستودع لا من الجذر
          VITE_BASE: "/For-TH/"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
