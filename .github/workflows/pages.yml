# نشر المعاينة على صفحات GitHub.
#
# ⚠️ مؤقّتٌ ما دام رصيد Netlify ناضباً: الموقع الحيّ لا يستقبل نشراً، وهذه
#    قناةٌ ثانية مجّانية بلا حدّ للمستودعات العامّة.
#
# ⚠️ و`VITE_BASE` لازمة: صفحات GitHub تخدم من `/For-TH/` لا من الجذر.
#    وبدونها تُحمَّل الصفحة ولا تُحمَّل حزمتها، فتظهر بيضاء بلا رسالة خطأ.
#
# ⚠️ ولا حاجة لإعادة كتابة المسارات: التوجيه في التطبيق **بالشذرة**
#    (`#/quiz/…`)، فلا يطلب المتصفّح من الخادم إلّا `index.html` وحده.
#
# ⚠️⚠️ ويُدفع المخرَج إلى فرع `gh-pages` **لا عبر `deploy-pages`**: مصدر
#      الصفحات في هذا المستودع مضبوطٌ على الفرع لا على الإجراءات، وجرّبتُ
#      `deploy-pages` فرسب. فالعمل مع الآليّة القائمة أصحّ من تغيير إعدادٍ
#      خارج المستودع لا يراه من يقرأ الشفرة.
name: معاينة صفحات GitHub

on:
  push:
    branches: [claude/new-project-repositories-exeq9g]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - run: npm run build
        working-directory: app
        env:
          VITE_BASE: /For-TH/

      - name: دفع المخرَج إلى فرع gh-pages
        working-directory: app/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ⚠️ خرائط المصدر لا تُنشر: ملفّاتٌ للتنقيح تضاعف حجم النشرة.
          rm -f assets/*.map
          # ⚠️ `.nojekyll` لازم: بدونه يتجاهل Jekyll كل ما يبدأ بشرطةٍ سفلية.
          touch .nojekyll
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "معاينة: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:gh-pages
