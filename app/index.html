<!doctype html>
<!--
  ⚠️ سمة العرض على `html` — العنصر الجذر — لا على `body`.

  البند ١٥ من ملف الخبرات: كانت الفئة على `body`، وشريط تمرير **الصفحة
  يُرسم من `html`**، و`html` يقرأ القيم الفاتحة لأنّ الفئة تحته لا فوقه.
  فظهر شريط تمرير بلون الورق فوق صفحة داكنة، ولم يظهر في لقطات الشاشة
  (أشرطة التمرير ليست من محتوى الصفحة) ولا على الجوّال (أشرطة عائمة) —
  فبدا لغزاً لأسابيع.
-->
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>أ. ‹اسم المعلّم› — منصّة الرياضيات</title>
    <meta name="description" content="منصّة الأستاذ لتدريس القدرات الكمّي والتحصيلي — رياضيات." />
    <meta name="theme-color" content="#101820" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      ⚠️ سياسة محتوى الصفحة (البند ١٤): طبقةٌ أخيرة تفترض أنّ ما قبلها اختُرق.
      و`connect-src` يحتاج نطاق Supabase الفعلي — يُضبط عند اختيار المشروع.

      ⚠️ ولا `frame-ancestors` هنا: **تُتجاهَل تماماً** في وسم <meta>، ولا
         تعمل إلّا ترويسةً حقيقية — وموضعها `public/_headers`. وكانت هنا
         فبدت حمايةً قائمة وهي لا تفعل شيئاً.

      ودرسٌ كلّف جلسةً كاملة: سياسةٌ صارمة حجبت أداةً تحقنها منصّة الاستضافة
      في روابط المعاينة، فظهر مستطيل أبيض فارغ أسفل الصفحة لا يظهر في
      الإنتاج، وضاع وقتٌ في مطاردة شفرة الموقع والعلّة ليست فيه. فإن رأيت
      عنصراً يظهر في المعاينة دون الإنتاج — ابدأ بما يفرّق الموضعين.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               form-action 'self';
               img-src 'self' data: blob: https://*.supabase.co;
               font-src 'self' https://fonts.gstatic.com;
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               script-src 'self';
               connect-src 'self' https://*.supabase.co wss://*.supabase.co;"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&family=Almarai:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      ⚠️ ملفٌّ منفصل لا نصٌّ سطريّ: `script-src 'self'` في سياسة المحتوى
         **ترفض النصوص السطرية**، فكان هذا محجوباً بصمت ويومض الوضع الخطأ
         لمن اختار الفاتح. انظر التفصيل داخل الملفّ.
      وهو قبل الحزمة وبلا `defer` بعمد: يجب أن ينفّذ قبل أوّل رسم.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
